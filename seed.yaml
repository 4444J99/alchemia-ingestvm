schema_version: "1.0"
organ: Meta
org: meta-organvm
repo: alchemia-ingestvm

metadata:
  description: "Material ingestion pipeline and aesthetic nervous system"
  language: python
  implementation_status: ACTIVE
  promotion_status: CANDIDATE

release:
  workflow: .github/workflows/release.yml
  tag_pattern: "v*"
  install_command: "pip install -e ."
  smoke_commands:
    - "alchemia --help"
    - "alchemia status"
  artifacts:
    - wheel
    - sdist
  promotion:
    from: CANDIDATE
    to: PRODUCTION
    requires:
      - tagged release published
      - release workflow smoke test passes in CI

agents: []

produces:
  - classified-artifacts
  - deployment-manifests
  - provenance-records
  - creative-briefs
  - aesthetic-chains

consumes:
  - source: organvm-corpvs-testamentvm
    artifact: registry-v2.json

subscriptions: []
