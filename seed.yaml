schema_version: "1.0"
organ: Meta
org: meta-organvm
repo: alchemia-ingestvm

metadata:
  description: "Aesthetic ingestion and provenance pipeline for Organ II"
  language: python
  implementation_status: ACTIVE
  promotion_status: CANDIDATE

deployment:
  type: python-package
  build_system: setuptools
  entry_point: alchemia
  artifact_pattern: "dist/*.whl"
  release_channel: github-releases
  verification:
    install_smoke_test: "alchemia status"
    reproducible_build: true

agents: []

produces:
  - classified-artifacts
  - deployment-manifests
  - provenance-records
  - creative-briefs
  - aesthetic-chains

consumes:
  - source: organvm-corpvs-testamentvm
    artifact: registry-v2.json

subscriptions: []
