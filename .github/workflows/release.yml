name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with pyright
        run: |
          pip install pyright
          pyright src/

      - name: Run tests
        run: pytest tests/ -v

  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build distribution
        run: python -m build

      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/alchemia-smoke-venv
          /tmp/alchemia-smoke-venv/bin/pip install dist/*.whl
          /tmp/alchemia-smoke-venv/bin/alchemia --help
          /tmp/alchemia-smoke-venv/bin/alchemia status

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alchemia-dist
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
