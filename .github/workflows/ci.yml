name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with pyright
        run: |
          pip install pyright
          pyright src/

      - name: Run tests
        run: pytest tests/ -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify isolated built artifact
        run: |
          python -m venv /tmp/alchemia-artifact
          /tmp/alchemia-artifact/bin/python -m pip install --upgrade pip
          /tmp/alchemia-artifact/bin/python -m pip install dist/*.whl
          /tmp/alchemia-artifact/bin/alchemia --help
          /tmp/alchemia-artifact/bin/alchemia status
